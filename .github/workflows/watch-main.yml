# Starts the Neus gate when zenderock/Neus-Platform main moves.
#
# Actions cannot start on the private repository, so a push there cannot
# trigger anything directly. Instead this workflow polls: every five minutes
# it reads the head of main and, if that commit has no neus-ci/gate status and
# no gate run was dispatched for it yet, dispatches gate.yml on that exact SHA.
#
# Canonical copy: infra/github/neus-ci/ in the source repository.
# GitHub disables schedules in a public repository after 60 days without a
# commit there; re-enable with `gh workflow enable watch-main.yml -R
# releaseszenderock/neus-ci`.
name: Neus Watch main

run-name: Watch zenderock/Neus-Platform main

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: neus-watch-main
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      SOURCE_REPOSITORY: zenderock/Neus-Platform
      SOURCE_BRANCH: main
      STATUS_CONTEXT: neus-ci/gate
    steps:
      - name: Dispatch the gate for an unchecked head of main
        env:
          SOURCE_REPO_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test -n "$SOURCE_REPO_TOKEN" || { echo "::error::SOURCE_REPO_TOKEN is not set"; exit 1; }
          source_api() {
            curl --fail-with-body --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $SOURCE_REPO_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$SOURCE_REPOSITORY/$1"
          }

          sha="$(source_api "git/ref/heads/$SOURCE_BRANCH" | jq -r '.object.sha')"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Could not resolve $SOURCE_BRANCH"; exit 1; }
          short="${sha:0:8}"

          reported="$(source_api "commits/$sha/statuses?per_page=100" \
            | jq --arg context "$STATUS_CONTEXT" '[.[] | select(.context == $context)] | length')"
          # A gate run is named after its SOURCE_REF, here the full SHA.
          dispatched="$(gh run list --workflow gate.yml --limit 100 --json displayTitle \
            | jq --arg sha "$sha" '[.[] | select(.displayTitle | contains($sha))] | length')"

          if [ "$reported" -gt 0 ]; then
            outcome="$short already has a $STATUS_CONTEXT status"
          elif [ "$dispatched" -gt 0 ]; then
            outcome="a gate run was already dispatched for $short"
          else
            gh workflow run gate.yml --ref "${{ github.event.repository.default_branch }}" \
              -f SOURCE_REF="$sha" -f CHECKS=all -f LABEL="push on $SOURCE_BRANCH"
            outcome="dispatched the gate for $short"
          fi
          echo "$outcome"
          echo "**$SOURCE_REPOSITORY@$SOURCE_BRANCH**: $outcome" >> "$GITHUB_STEP_SUMMARY"
